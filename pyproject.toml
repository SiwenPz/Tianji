[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tianji"
version = "0.5.2"
description = "天机: 多 CLI 编程助手协作框架(自举开发)"
requires-python = ">=3.9"
dependencies = ["typer", "fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
tianji = "tianji.cli:app"

[tool.setuptools.packages.find]
include = ["tianji*"]

[tool.setuptools.package-data]
tianji = ["skills/*/SKILL.md"]
