<!DOCTYPE html>
<!--
  PROTOTYPE v2(用完即弃): 天机驾驶舱 × IM 质感。三个变体:
  A=深色 IM 三栏(左: 实例列表按桶分组 / 中: 总控对话 / 右: peek 详情)
  B=cumora 原味浅色(同 A 布局,亮色系)
  C=保留四桶横排布局,只把皮肤和对话面 IM 化(改动最小)
  底部浮条或 ← → 切换。①peek 详情 ⑤耗时条 保留;手机窄屏另议(本原型不做)。
-->
<html lang="zh"><head><meta charset="utf-8"><title>PROTOTYPE v2 · 驾驶舱 IM 化</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,sans-serif;font-size:13px}
button{cursor:pointer;border:0;font-family:inherit}
/* ============ 共享零件 ============ */
.avatar{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
 color:#fff;font-weight:600;flex:none}
.av-claude{background:#c8845a}.av-kimi{background:#5a8fc8}.av-codex{background:#6ab187}
.av-cline{background:#9a6ac8}.av-atomcode{background:#c85a7a}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.working{background:#f5a623}.dot.error{background:#e5534b}.dot.idle{background:#9aa4b8}.dot.done{background:#4caf7d}
.tbar{height:3px;border-radius:2px;background:rgba(128,140,168,.25);overflow:hidden;margin-top:4px}
.tbar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#5a8fc8,#4caf7d)}
.time{color:#98a2b8;font-size:11px;flex:none}
.badge{background:#e5534b;color:#fff;border-radius:9px;font-size:11px;padding:1px 7px;flex:none}
/* ============ A: 深色 IM 三栏 ============ */
.A{background:#0b0f1a;color:#dde3ee}
.A .rail{width:280px;background:#0e1424;border-right:1px solid #1e2740;display:flex;flex-direction:column;flex:none}
.A .chat{flex:1;display:flex;flex-direction:column;min-width:0;background:radial-gradient(900px 400px at 60% -10%,#14203a 0%,#0b0f1a 60%)}
.A .peek{width:clamp(420px,32vw,560px);background:#0e1424;border-left:1px solid #1e2740;flex:none;overflow-y:auto;transition:margin .2s}
.A .peek.closed{margin-right:calc(-1 * clamp(420px,32vw,560px))}
/* 左栏行: 卡片化,行间有缝有底,选中亮边 */
.A .rail-item{display:flex;gap:10px;padding:10px 12px;cursor:pointer;border-radius:10px;margin:0 8px 6px;
 background:#131b30;border:1px solid #1c2642;transition:background .15s,border-color .15s}
.A .rail-item:hover{background:#1a2440;border-color:#26324e}
.A .rail-item.sel{background:#1c2947;border-color:#3d5a8e;box-shadow:inset 2px 0 0 #5a8fc8}
.A .rail h4{margin:16px 14px 6px;color:#7e93bd;font-size:11px;letter-spacing:1.5px;font-weight:600}
.A .bubble-a{background:#1a2338;border:1px solid #22304e;border-radius:4px 14px 14px 14px;padding:9px 13px;max-width:72%;line-height:1.6}
.A .bubble-u{background:#2b4a7e;border-radius:14px 4px 14px 14px;padding:9px 13px;max-width:72%;margin-left:auto;line-height:1.6}
.A .sysline{color:#7e93bd;font-size:12px}
.A .thinking{color:#f5a623;font-size:12px}
.A .approve-card{background:#22301c;border:1px solid #3d5a2e;border-radius:12px;padding:10px 14px}
.A .esc-card{background:#33181f;border:1px solid #6e2b36;border-radius:12px;padding:10px 14px}
.A .chat-head{padding:10px 16px;border-bottom:1px solid #1e2740;display:flex;gap:10px;align-items:center;background:rgba(16,22,42,.8)}
.A .inputbar{display:flex;gap:8px;padding:12px 16px}
.A .inputbar input{flex:1;background:#10162a;border:1px solid #26324e;border-radius:18px;padding:10px 16px;color:#dde3ee;outline:none}
.A .inputbar input:focus{border-color:#3d5a8e;box-shadow:0 0 0 2px rgba(61,90,142,.25)}
.A button{background:#26355c;color:#dde3ee;border-radius:6px;padding:5px 12px}
/* 按钮分档: 批准=实心绿,驳回=实心红,顶栏=图标按钮 */
.btn-ok{background:linear-gradient(90deg,#2e7d32,#43a047);color:#fff;border-radius:8px;padding:6px 16px;font-weight:600}
.btn-ok:hover{filter:brightness(1.12)}
.btn-no{background:linear-gradient(90deg,#c62828,#e5534b);color:#fff;border-radius:8px;padding:6px 16px;font-weight:600}
.btn-no:hover{filter:brightness(1.12)}
.btn-ghost{background:#131b30;border:1px solid #26324e;color:#c8d2e8;border-radius:8px;padding:6px 14px;
 display:inline-flex;gap:6px;align-items:center}
.btn-ghost:hover{border-color:#3d5a8e;background:#1a2440;color:#fff}
.btn-ghost .ic{font-size:14px;line-height:1}
/* 标题呼吸 */
@keyframes brandGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}
.brand{font-size:16px;letter-spacing:2px;background:linear-gradient(90deg,#8fd0ff,#7ab648);
 -webkit-background-clip:text;background-clip:text;color:transparent;animation:brandGlow 3.2s infinite ease-in-out}
/* peek 详情: 头像环+分区+行式分隔,不用重边框表格 */
.peek-head{padding:18px 16px;border-bottom:1px solid #1e2740;display:flex;gap:12px;align-items:center;
 background:linear-gradient(180deg,#14203a 0%,#0e1424 100%)}
.peek-ring{border-radius:50%;padding:2px;background:linear-gradient(135deg,#5a8fc8,#4caf7d)}
.peek-rows{padding:6px 16px}
.peek-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(30,39,64,.6)}
.peek-row span:first-child{color:#7e93bd}
.peek-acts{padding:14px 16px;display:flex;gap:8px}
/* ============ B: cumora 原味浅色 ============ */
.B{background:#f2f4f8;color:#1c2333}
.B .rail{width:300px;background:#fff;border-right:1px solid #e3e8f0;display:flex;flex-direction:column;flex:none}
.B .chat{flex:1;display:flex;flex-direction:column;min-width:0;background:#f2f4f8}
.B .peek{width:clamp(420px,32vw,560px);background:#fff;border-left:1px solid #e3e8f0;flex:none;overflow-y:auto;transition:margin .2s}
.B .peek.closed{margin-right:calc(-1 * clamp(420px,32vw,560px))}
.B .rail-item{display:flex;gap:10px;padding:9px 12px;cursor:pointer;border-radius:10px;margin:0 8px}
.B .rail-item:hover{background:#f0f3f9}
.B .rail-item.sel{background:#e8f0fe}
.B .rail h4{margin:14px 14px 4px;color:#8a94a8;font-size:11px;letter-spacing:1px;font-weight:600}
.B .bubble-a{background:#fff;border:1px solid #e3e8f0;border-radius:4px 16px 16px 16px;padding:10px 14px;max-width:70%;line-height:1.65;box-shadow:0 1px 2px rgba(20,30,60,.06)}
.B .bubble-u{background:#3d7bfd;color:#fff;border-radius:16px 4px 16px 16px;padding:10px 14px;max-width:70%;margin-left:auto;line-height:1.65}
.B .sysline{color:#8a94a8;font-size:12px}
.B .thinking{color:#c47f0e;font-size:12px}
.B .approve-card{background:#eef7ec;border:1px solid #b9dcc0;border-radius:14px;padding:10px 14px}
.B .esc-card{background:#fdeeee;border:1px solid #f2c4c4;border-radius:14px;padding:10px 14px}
.B .chat-head{padding:12px 18px;border-bottom:1px solid #e3e8f0;display:flex;gap:10px;align-items:center;background:#fff}
.B .inputbar{display:flex;gap:8px;padding:12px 18px;background:transparent}
.B .inputbar input{flex:1;background:#fff;border:1px solid #dde3ee;border-radius:20px;padding:11px 18px;outline:none}
.B .inputbar input:focus{border-color:#3d7bfd}
.B button{background:#eaf0fe;color:#2456c4;border-radius:8px;padding:6px 14px}
.B .time{color:#9aa4b8}
/* ============ C: 四桶保留+IM 皮肤 ============ */
.C{background:radial-gradient(1200px 500px at 70% -10%,#16203a 0%,#0b0f1a 55%);color:#dde3ee;display:flex;flex-direction:column}
.C .buckets{display:flex;gap:10px;padding:10px;flex:none}
.C .bucket{flex:1;background:rgba(22,29,46,.8);border:1px solid #1e2740;border-radius:10px;padding:8px 10px;min-height:90px;max-height:24vh;overflow-y:auto}
.C .bucket h3{margin:0 0 6px;font-size:11px;color:#7e93bd;letter-spacing:1px}
.C .card{background:#1a2338;border-radius:10px;padding:7px 10px;margin-bottom:6px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.C .card:hover{background:#223052}
.C .chatwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 10px 10px}
.C .stream{flex:1;min-height:0;overflow-y:auto;background:rgba(13,18,32,.85);border:1px solid #1e2740;border-radius:14px;padding:14px}
.C .bubble-a{background:#1a2338;border:1px solid #22304e;border-radius:4px 14px 14px 14px;padding:9px 13px;max-width:75%;line-height:1.6}
.C .bubble-u{background:#2b4a7e;border-radius:14px 4px 14px 14px;padding:9px 13px;max-width:75%;margin-left:auto;line-height:1.6}
.C .sysline{color:#7e93bd;font-size:12px}
.C .inputbar{display:flex;gap:8px;padding-top:10px}
.C .inputbar input{flex:1;background:#10162a;border:1px solid #26324e;border-radius:18px;padding:10px 16px;color:#dde3ee;outline:none}
.C button{background:#26355c;color:#dde3ee;border-radius:6px;padding:5px 12px}
/* ============ 切换器(原型件,不是设计) ============ */
#sw{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:99;background:#000;color:#fff;
 border:2px solid #f5a623;border-radius:20px;padding:6px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.5)}
#sw button{background:#333;color:#fff;border-radius:12px;padding:2px 10px}
.rowtop{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;gap:14px;align-items:center;padding:8px 16px}
</style></head><body>
<div id="root" style="height:100%"></div>
<div id="sw"><button onclick="cyc(-1)">◀</button><span id="vl"></span><button onclick="cyc(1)">▶</button></div>
<script>
/* ===== 假数据(形状照 /api/snapshot) ===== */
const CREW=[
 {name:"总控",shell:"claude",model:"deepseek-v4-flash",role:"总控",state:"working",task:"等你派活",did:null,tool:"",ago:"刚刚",dur:0,quota:38,esc:false,preview:"你好,天机已就位。"},
 {name:"审核1",shell:"kimi",model:"k3",role:"审核",state:"working",task:"票27 nudge 复审",did:124,tool:"Read",ago:"30秒",dur:6,quota:71,esc:false,preview:"正在读 wt-124 的第 3 个文件…"},
 {name:"实施1",shell:"claude",model:"deepseek-v4-flash",role:"实施",state:"working",task:"web 配置页落地",did:131,tool:"Edit",ago:"1分钟",dur:23,quota:12,esc:false,preview:"webapp.py 改到一半"},
 {name:"实施2",shell:"cline",model:"deepseek",role:"实施",state:"working",task:"红黑榜视图插件",did:130,tool:"Bash",ago:"3分钟",dur:41,quota:64,esc:true,preview:"进度阶梯超限(41min)"},
 {name:"审核2",shell:"codex",model:"deepseek-v4-pro",role:"审核",state:"idle",task:"(空闲)",did:null,tool:"",ago:"12分钟",dur:0,quota:5,esc:false,preview:"空闲"},
 {name:"实施3",shell:"atomcode",model:"glm-5.2",role:"实施",state:"idle",task:"(空闲)",did:null,tool:"",ago:"1小时",dur:0,quota:0,esc:false,preview:"空闲"},
];
const GROUPS=[["attention","待处理",c=>c.esc],["working","进行中",c=>!c.esc&&c.state==="working"],
 ["idle","空闲",c=>c.state==="idle"],["done","已结算",c=>c.state==="done"]];
const MAXD=Math.max(...CREW.map(c=>c.dur),1);
const CHAT=[
 {who:"u",text:"票 27 的复审进展怎么样了?"},
 {who:"think",text:"思维链: 先看派单 124 的状态,审核1 在跑,翻它的转录字节……"},
 {who:"a",text:"审核1 已经过完 3/5 条 Spec 轴,目前没发现阻塞点。实施2 那单超了进度阶梯,我发了升级,你看一眼上面那张红卡。"},
 {who:"tool",text:"⚙ 正在执行: Bash(pytest tests/ -q)"},
 {who:"typing",text:""},
];
let peekOf=null;
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function avat(c,sz){return `<span class="avatar av-${c.shell}" style="${sz?`width:${sz}px;height:${sz}px`:""}">${esc(c.name[0])}</span>`}
function stateDot(c){return `<span class="dot ${c.esc?"error":c.state}"></span>`}
function tbar(c){return c.dur?`<div class="tbar"><i style="width:${Math.round(c.dur/MAXD*100)}%"></i></div>`:""}
function railItem(c,v){
 return `<div class="rail-item ${peekOf===c.name?"sel":""}" onclick="peekOf=(peekOf==='${c.name}'?null:'${c.name}');render()">
  <span style="position:relative">${avat(c,34)}<span style="position:absolute;right:-1px;bottom:-1px">${stateDot(c)}</span></span>
  <span style="flex:1;min-width:0">
   <span style="display:flex;justify-content:space-between;gap:6px"><b>${esc(c.name)}</b><span class="time">${c.ago}</span></span>
   <span style="display:flex;justify-content:space-between;gap:6px">
    <span style="color:${v==="B"?"#5a6478":"#8fa3c8"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.preview)}</span>
    ${c.esc?`<span class="badge">1</span>`:""}</span>
   ${tbar(c)}
  </span></div>`}
function chatMsg(m,v){
 if(m.who==="u")return `<div style="display:flex"><div class="bubble-u">${esc(m.text)}</div></div>`;
 if(m.who==="think")return `<div class="thinking">▸ ${esc(m.text)}</div>`;
 if(m.who==="tool")return `<div class="sysline">${esc(m.text)}</div>`;
 if(m.who==="typing")return `<div class="sysline" style="display:flex;gap:8px;align-items:center">${avat(CREW[0],24)}<span class="thinking">总控正在输入…</span></div>`;
 return `<div style="display:flex;gap:8px;align-items:flex-start">${avat(CREW[0],30)}<div class="bubble-a">${esc(m.text)}</div></div>`}
function peekPanel(v){
 if(!peekOf)return `<div class="peek closed"></div>`;
 if(peekOf==="__org__"){
  return `<div class="peek"><div class="peek-head"><b>角色编排与条目</b><span style="flex:1"></span>
   <button class="btn-ghost" onclick="peekOf=null;render()">收起 ×</button></div>
   <div class="peek-rows">${CREW.map(c=>`<div class="peek-row"><span>${c.name}(${c.role})</span><span>${c.shell} + ${esc(c.model)}</span></div>`).join("")}</div></div>`}
 const c=CREW.find(x=>x.name===peekOf);
 return `<div class="peek">
  <div class="peek-head"><span class="peek-ring">${avat(c,44)}</span>
   <div><div style="font-size:15px"><b>${esc(c.name)}</b> ${stateDot(c)}</div>
   <div class="sysline">${c.shell} + ${esc(c.model)} · ${c.role}</div></div>
   <span style="flex:1"></span><button class="btn-ghost" onclick="peekOf=null;render()">收起 ×</button></div>
  <div class="peek-rows">
   ${[["当前任务",c.task+(c.did?" #"+c.did:"")],["当前工具",c.tool||"-"],["本单耗时",c.dur+" min"],
      ["额度剩余",c.quota+"%"+(c.quota<20?" ⚠将尽":"")],["最后动静",c.ago+"前"],
      ["升级",c.esc?"⚠ 进度阶梯超限":"无"]].map(([k,vv])=>`<div class="peek-row"><span>${k}</span><span>${esc(vv)}</span></div>`).join("")}
  </div>
  <div class="peek-acts"><button class="btn-ghost">续推 nudge</button><button class="btn-no">强制干预…</button></div>
 </div>`}
function flowCards(v){
 const ok=v==="B"?"":"btn-ok",no=v==="B"?"":"btn-no";
 return `<div class="approve-card" style="margin-bottom:8px"><b>[计划确认]</b> #131 web 配置页落地
  <div style="margin-top:8px;display:flex;gap:8px"><button class="${ok}">✓ 批准</button><button class="${no}">✗ 驳回</button></div></div>
  <div class="esc-card" style="margin-bottom:8px">⚠ 实施2 进度阶梯超限(已 41min,expect 15min) —— <u>知道了</u></div>`}
/* ===== 变体 A/B: 三栏 IM(深/浅) ===== */
function renderAB(v){
 return `<div class="${v}" style="display:flex;height:100%">
  <div class="rail">
   <div style="padding:14px 16px 6px"><b class="brand">天机驾驶舱</b></div>
   ${GROUPS.map(([k,label,fn])=>{const cs=CREW.filter(fn);if(!cs.length)return"";
    return `<h4>${label} · ${cs.length}</h4>`+cs.map(c=>railItem(c,v)).join("")}).join("")}
  </div>
  <div class="chat">
   <div class="chat-head">${avat(CREW[0],34)}<div><b>总控</b> ${stateDot(CREW[0])}<div class="sysline">claude + deepseek-v4-flash</div></div>
    <span style="flex:1"></span><button class="${v==="B"?"":"btn-ghost"}" onclick="alert('配置页 /setup(原型略)')"><span class="ic">⚙️</span>配置</button>
    <button class="${v==="B"?"":"btn-ghost"}" onclick="peekOf='__org__';render()"><span class="ic">🗂️</span>角色/条目</button></div>
   <div style="flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px">
    ${flowCards(v)}${CHAT.map(m=>chatMsg(m,v)).join("")}
   </div>
   <div class="inputbar"><input placeholder="跟总控说话 …(批准 16 / 驳回 16 也可以直接敲)"><button class="${v==="B"?"":"btn-ok"}" style="${v==="B"?"":"background:linear-gradient(90deg,#2b4a7e,#3d6ab8)"}">发送</button></div>
  </div>
  ${peekPanel(v)}
 </div>`}
/* ===== 变体 C: 四桶保留+IM 皮肤 ===== */
function renderC(){
 const buckets=GROUPS.map(([k,label,fn])=>{
  const cs=CREW.filter(fn);
  const inner=cs.length?cs.map(c=>
    `<div class="card" onclick="alert('C 变体里 peek 同 A: 右侧详情(此演示略)')">
     ${avat(c,28)}<span style="flex:1;min-width:0"><b>${esc(c.name)}</b> ${stateDot(c)} ${c.esc?"<span class='badge'>1</span>":""}<br>
     <small style="color:#8fa3c8">${esc(c.task)} ${c.did?"#"+c.did:""} · ${c.ago}</small>${tbar(c)}</span></div>`).join("")
   :"<small style='color:#567'>(空)</small>";
  return `<div class="bucket"><h3>${label} (${cs.length})</h3>${inner}</div>`}).join("");
 return `<div class="C" style="height:100%">
  <div class="rowtop" style="position:static;background:rgba(22,29,46,.75);border-bottom:1px solid #1e2740">
   <b style="font-size:16px;letter-spacing:2px;background:linear-gradient(90deg,#8fd0ff,#7ab648);-webkit-background-clip:text;background-clip:text;color:transparent">天机驾驶舱</b>
   <span class="sysline">会话 6 · 升级 1</span><span style="flex:1"></span><button>配置</button><button>角色/条目</button></div>
  <div class="buckets">${buckets}</div>
  <div style="padding:0 10px">${flowCards("C")}</div>
  <div class="chatwrap"><div class="stream"><div style="display:flex;flex-direction:column;gap:10px">
   ${CHAT.map(m=>chatMsg(m,"C")).join("")}</div></div>
   <div class="inputbar"><input placeholder="跟总控说话 …"><button>发送</button></div></div>
 </div>`}
/* ===== 切换 ===== */
const VS={A:"深色 IM 三栏",B:"cumora 原味浅色",C:"四桶保留+IM 皮肤"};
function cur(){return new URLSearchParams(location.search).get("v")||"A"}
function render(){
 const v=cur();peekOf=v==="C"?null:peekOf;
 document.getElementById("root").innerHTML=v==="B"?renderAB("B"):v==="C"?renderC():renderAB("A");
 document.getElementById("vl").textContent=`${v} — ${VS[v]}`}
function cyc(d){const ks=Object.keys(VS);const n=(ks.indexOf(cur())+d+ks.length)%ks.length;
 const q=new URLSearchParams(location.search);q.set("v",ks[n]);history.replaceState(null,"","?"+q);peekOf=null;render()}
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA"].includes(e.target.tagName))return;
 if(e.key==="ArrowLeft")cyc(-1);if(e.key==="ArrowRight")cyc(1)});
render();
</script></body></html>
